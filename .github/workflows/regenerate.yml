name: Regenerate PluginMaster
on: 
  workflow_dispatch:
  push:
    branches:
    - master
    - api4
concurrency: regenerate

# The default GITHUB_TOKEN is read-only, so EndBug/add-and-commit could not push
# the regenerated catalog and the job failed with "Resource not accessible by
# integration". contents: write is the minimum scope it needs.
permissions:
  contents: write

jobs:
  generate:
    name: Regenerate PluginMaster
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v2
        with:
            python-version: '3.8'
      - uses: actions/checkout@v2
      - name: Generate PluginMaster
        run: python generate_pluginmaster.py
      - uses: EndBug/add-and-commit@v7
        with:
          author_name: GitHub Action
          author_email: github-actions[bot]@users.noreply.github.com
          message: Regenerate PluginMaster
